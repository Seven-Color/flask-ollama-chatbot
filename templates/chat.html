<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama 智能聊天助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 { color: #fff; font-size: 1.3rem; }
        
        .chat-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-bottom: 20px;
            min-height: 400px;
        }
        
        .message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        .message.user { flex-direction: row-reverse; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .message.user .avatar { background: linear-gradient(135deg, #667eea, #764ba2); }
        .message.assistant .avatar { background: linear-gradient(135deg, #11998e, #38ef7d); }
        
        .message-content {
            max-width: 70%;
            margin: 0 12px;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            border-bottom-left-radius: 4px;
        }
        
        .input-area {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .input-area textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            resize: none;
            max-height: 120px;
            outline: none;
            padding: 8px;
        }
        
        .input-area textarea::placeholder { color: #888; }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-send {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        
        .btn-send:hover { transform: scale(1.05); }
        
        .btn-voice {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        
        .btn-voice:hover { background: rgba(255,255,255,0.2); }
        
        .btn-voice.recording { background: #e74c3c; }
        
        .btn-voice.whisper-mode { background: #3498db; }
        
        .btn-clear { background: rgba(255,255,255,0.1); color: #aaa; }
        .btn-clear:hover { background: rgba(255,255,255,0.2); color: #fff; }
        
        .btn-tts { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-tts:hover { background: rgba(255,255,255,0.2); }
        .btn-tts.on { background: #27ae60; }
        
        .controls { display: flex; gap: 8px; }
        
        .status { color: #888; font-size: 12px; text-align: center; padding: 8px; }
        
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
        }
        
        .typing span {
            width: 8px; height: 8px;
            background: #38ef7d;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .typing span:nth-child(1) { animation-delay: 0s; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .voice-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .voice-modal.active { display: flex; }
        
        .voice-modal-content {
            background: #2a2a4a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .voice-modal h3 { color: #fff; margin-bottom: 20px; }
        
        .voice-wave {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 20px auto;
            animation: pulse-wave 1s infinite;
        }
        
        @keyframes pulse-wave {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .voice-result { color: #38ef7d; font-size: 18px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Ollama 智能助手</h1>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message assistant">
                <div class="avatar">🤖</div>
                <div class="message-content">你好！我是基于 Ollama 的 AI 助手。

支持功能：
• 💬 文本聊天
• 🎤 语音输入
• 🔊 语音输出

请开始聊天吧！</div>
            </div>
        </div>
        
        <div class="input-area">
            <textarea id="messageInput" placeholder="输入消息..." rows="1"></textarea>
            <div class="controls">
                <button class="btn btn-voice" id="voiceBtn">🎤</button>
                <button class="btn btn-tts" id="ttsBtn">🔊</button>
                <button class="btn btn-send" id="sendBtn">发送</button>
                <button class="btn btn-clear" id="clearBtn">🗑️</button>
            </div>
        </div>
        
        <div class="status" id="status">就绪</div>
    </div>
    
    <!-- 语音弹窗 -->
    <div class="voice-modal" id="voiceModal">
        <div class="voice-modal-content">
            <h3>🎤 正在录音...</h3>
            <div class="voice-wave"></div>
            <div class="voice-result" id="voiceResult"></div>
            <button class="btn btn-send" id="stopVoiceBtn">完成</button>
        </div>
    </div>

    <script>
        const sessionId = 'session_' + Date.now();
        let isRecording = false;
        let recognition = null;
        let isSpeaking = false;
        let ttsEnabled = false;
        let whisperMode = false; // Whisper 离线模式
        let mediaRecorder = null;
        let audioChunks = [];
        
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const ttsBtn = document.getElementById('ttsBtn');
        const statusDiv = document.getElementById('status');
        const voiceModal = document.getElementById('voiceModal');
        const voiceResult = document.getElementById('voiceResult');
        const stopVoiceBtn = document.getElementById('stopVoiceBtn');
        
        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            addMessage('user', message);
            messageInput.value = '';
            
            const waitingMsg = addMessage('assistant', '');
            const contentDiv = waitingMsg.querySelector('.message-content');
            contentDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            statusDiv.textContent = '正在思考...';
            
            try {
                const res = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message, session_id: sessionId})
                });
                
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                contentDiv.querySelector('.typing')?.remove();
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value);
                    const lines = text.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.token) {
                                    contentDiv.textContent += data.token;
                                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                statusDiv.textContent = '就绪';
                
                // 如果 TTS 开启，自动播放回复
                if (ttsEnabled) {
                    speakText(contentDiv.textContent);
                }
            } catch (e) {
                contentDiv.textContent = '错误: ' + e.message;
                statusDiv.textContent = '错误';
            }
        }
        
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
                            <div class="message-content">${escapeHtml(content)}</div>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return div;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 事件
        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });
        
        clearBtn.addEventListener('click', async () => {
            if (confirm('确定清除对话历史吗？')) {
                await fetch(`/api/history?session_id=${sessionId}`, {method: 'DELETE'});
                messagesDiv.innerHTML = `<div class="message assistant">
                    <div class="avatar">🤖</div>
                    <div class="message-content">对话已清除</div>
                </div>`;
            }
        });
        
        // 语音输入 - 支持 Whisper 离线模式
        voiceBtn.addEventListener('click', async () => {
            // 切换 Whisper 模式
            whisperMode = !whisperMode;
            voiceBtn.classList.toggle('whisper-mode', whisperMode);
            
            if (whisperMode) {
                statusDiv.textContent = 'Whisper 模式 - 点击录音';
                
                if (isRecording) {
                    // 停止录音
                    mediaRecorder.stop();
                    isRecording = false;
                    voiceBtn.classList.remove('recording');
                } else {
                    // 开始录音
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];
                        
                        mediaRecorder.ondataavailable = (e) => {
                            audioChunks.push(e.data);
                        };
                        
                        mediaRecorder.onstop = async () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                            const formData = new FormData();
                            formData.append('audio', audioBlob, 'recording.wav');
                            
                            voiceModal.classList.remove('active');
                            statusDiv.textContent = '正在识别...';
                            
                            try {
                                const res = await fetch('/api/stt', {
                                    method: 'POST',
                                    body: formData
                                });
                                const data = await res.json();
                                if (data.text) {
                                    messageInput.value = data.text;
                                    statusDiv.textContent = '识别完成';
                                } else {
                                    statusDiv.textContent = '识别失败: ' + (data.error || '未知错误');
                                }
                            } catch (e) {
                                statusDiv.textContent = '识别错误: ' + e.message;
                            }
                            
                            // 停止所有轨道
                            stream.getTracks().forEach(track => track.stop());
                        };
                        
                        mediaRecorder.start();
                        isRecording = true;
                        voiceBtn.classList.add('recording');
                        voiceModal.classList.add('active');
                        voiceResult.textContent = '正在录音...（点击停止）';
                        
                    } catch (e) {
                        alert('无法访问麦克风: ' + e.message);
                        whisperMode = false;
                        voiceBtn.classList.remove('whisper-mode');
                    }
                }
            } else {
                // Web Speech API 模式
                if (isRecording && mediaRecorder) {
                    mediaRecorder.stop();
                    isRecording = false;
                    voiceBtn.classList.remove('recording');
                }
                
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert('请使用 Chrome 浏览器');
                    return;
                }
                
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = false;
                recognition.interimResults = true;
                
                recognition.onstart = () => {
                    voiceBtn.classList.add('recording');
                    voiceModal.classList.add('active');
                    voiceResult.textContent = '正在聆听...';
                };
                
                recognition.onresult = (event) => {
                    let final = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    }
                    if (final) {
                        voiceResult.textContent = final;
                        messageInput.value = final;
                    }
                };
                
                recognition.onerror = (e) => {
                    voiceBtn.classList.remove('recording');
                    voiceModal.classList.remove('active');
                    voiceResult.textContent = '识别错误: ' + e.error;
                };
                
                recognition.onend = () => voiceBtn.classList.remove('recording');
                recognition.start();
            }
        });
        
        stopVoiceBtn.addEventListener('click', () => {
            if (whisperMode && mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
            } else if (recognition) {
                recognition.stop();
            }
            voiceModal.classList.remove('active');
        });
        
        // 语音输出 - 开关模式
        ttsBtn.addEventListener('click', () => {
            // 切换开关状态
            ttsEnabled = !ttsEnabled;
            ttsBtn.classList.toggle('on', ttsEnabled);
            
            if (ttsEnabled) {
                statusDiv.textContent = 'TTS 已开启 - 自动播放';
            } else {
                // 关闭时，播放当前对话
                const lastMsg = messagesDiv.querySelector('.message.assistant:last-child .message-content');
                if (lastMsg && !lastMsg.textContent.includes('正在思考')) {
                    speakText(lastMsg.textContent);
                }
                statusDiv.textContent = 'TTS 已关闭';
            }
        });
        
        // 语音播放函数
        function speakText(text) {
            if (!text || text.includes('正在思考')) return;
            
            if (isSpeaking) {
                speechSynthesis.cancel();
                isSpeaking = false;
                ttsBtn.classList.remove('speaking');
                return;
            }
            
            const utterance = new SpeechSynthesisUtterance(text);
            const zhVoice = speechSynthesis.getVoices().find(v => v.lang.startsWith('zh'));
            if (zhVoice) utterance.voice = zhVoice;
            
            utterance.onstart = () => {
                isSpeaking = true;
                ttsBtn.classList.add('speaking');
            };
            
            utterance.onend = () => {
                isSpeaking = false;
                ttsBtn.classList.remove('speaking');
            };
            
            speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
